name: Aetheris CI/CD Verification & Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-codebase:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository tree
        uses: actions/checkout@v4

      - name: Initialize Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Initialize Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run Rust Lints and Tests
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test --release

      - name: Run Go Backend Tests
        run: |
          cd backend
          go test -v -race ./...

      - name: Set up Helm Environment
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Validate and Lint Helm Chart Bundle
        run: |
          helm lint charts/aetheris-edge
          helm template aetheris-release charts/aetheris-edge > /dev/null
