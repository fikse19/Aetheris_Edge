{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-zero-trust-isolation
spec:
  podSelector:
    matchLabels:
      app: zt-accelerated-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              environment: {{ .Values.networkPolicy.ingressNamespaceLabel }}
      ports:
        - protocol: UDP
          port: {{ .Values.service.port }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              environment: {{ .Values.networkPolicy.egressNamespaceLabel }}
      ports:
        - protocol: UDP
          port: {{ .Values.service.port }}
{{- end -}}
