apiVersion: apps/v1
kind: Deployment
metadata:
  # Using the global Helm release name macro to avoid duplicate naming collisions
  name: {{ .Release.Name }}-gateway
  namespace: {{ .Release.Namespace | default "default" }}
  labels:
    app: zt-accelerated-gateway
spec:
  # Pulling dynamically from your updated charts/aetheris-edge/values.yaml file
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: zt-accelerated-gateway
  template:
    metadata:
      labels:
        app: zt-accelerated-gateway
    spec:
      # HOST-NETWORK MODE: Bypasses virtual overlays to bind directly to your machine's physical network cards
      hostNetwork: true
      containers:
      - name: gateway-core
        # Pulls from your private, authenticated AWS ECR registry path
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
          protocol: UDP
          name: quic-udp
        # System Resource Enforcements to prevent cluster memory bloat
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: zt-accelerated-loadbalancer
  namespace: default
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: zt-accelerated-gateway
  ports:
    - protocol: UDP
      port: 8080
      targetPort: 8080
